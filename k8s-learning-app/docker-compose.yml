# Local development without Kubernetes.
#
# Use this while you are writing code, then deploy to the cluster to learn the
# Kubernetes half. Running both is the point: the same app, two very different
# sets of problems.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: k8slearn
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: k8slearn
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U k8slearn -d k8slearn"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://k8slearn:devpass@postgres:5432/k8slearn
      JWT_SECRET: local-development-secret-at-least-32-characters
      DEFAULT_ADMIN_EMAIL: admin@example.com
      DEFAULT_ADMIN_PASSWORD: admin-password
      DEFAULT_ADMIN_NAME: Local Admin
      RUN_MIGRATIONS_ONLY: "true"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgres://k8slearn:devpass@postgres:5432/k8slearn
      JWT_SECRET: local-development-secret-at-least-32-characters
      LOG_LEVEL: info
      COOKIE_SECURE: "false"
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: ./frontend
    ports: ["8080:8080"]
    depends_on: [api]

volumes:
  pgdata:
